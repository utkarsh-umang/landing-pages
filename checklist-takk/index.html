<body class="h-full overflow-hidden font-body text-on-surface antialiased">
<main class="h-full min-h-0">
<!-- Hero: full-bleed image left, content right — fits in 100vh -->
<section class="relative flex h-full min-h-0 max-h-full flex-col overflow-hidden md:flex-row">
<!-- Left: edge-to-edge image -->
<div class="relative order-2 h-[40vh] w-full shrink-0 md:order-1 md:h-full md:min-h-0 md:w-1/2 md:flex-1">
<img alt="Professional real estate document signing" class="absolute inset-0 h-full w-full object-cover" data-alt="Close-up of a fountain pen signing a premium real estate contract on a dark marble desk with soft cinematic lighting and shallow depth of field" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZbsGaU1-l0cw0IBov9f2eAH1O3LZ4jMgnbS8bX9TXg_ekiVdlQ5c4_czxf1GgFUCX3PcVvbYufvwDahpRyadskHyUr1vGehD8XF3cjIp-5O05_bV9OPpQmfY8dXn_ipd3_3bQ0dJw4E8uVVDK4NAVb6bfYgBCehqG7HYXLmsclJZfrAbPVfvM-gFE91g0NySARLf_YK5StCRZCXeokLlEOpouaRLHF4qGYLTzn1BuGkfDgGr2QapFBL3T46ud8WvFqGojF5ra6yk"/>
<div class="pointer-events-none absolute inset-0 bg-gradient-to-r from-black/25 via-transparent to-transparent md:from-black/20"></div>
<!-- Floating checklist -->
<div class="absolute bottom-4 left-4 right-4 glass-effect rounded-lg border border-white/15 p-4 shadow-2xl md:bottom-auto md:left-auto md:right-8 md:top-1/2 md:max-w-xs md:-translate-y-1/2 md:rounded-xl md:p-8">
<p class="font-headline mb-2 text-xs font-bold uppercase tracking-widest text-white md:mb-3 md:text-sm">Deal Checklist</p>
<ul class="space-y-2 md:space-y-4">
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-xs font-medium text-white/90">Asset Valuation Verification</span>
</li>
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-xs font-medium text-white/90">Escrow Security Protocols</span>
</li>
<li class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-xs font-medium text-white/90">Zoning &amp; Compliance Audit</span>
</li>
</ul>
</div>
</div>
<!-- Right: copy + form -->
<div class="hero-panel-bg order-1 flex min-h-0 w-full flex-1 flex-col justify-center px-5 py-5 sm:px-8 md:order-2 md:h-full md:w-1/2 md:flex-none md:px-10 md:py-8 lg:px-14 xl:px-16">
<div class="mx-auto w-full max-w-lg space-y-5 md:space-y-7">
<div class="space-y-3">
<h1 class="font-headline text-[1.65rem] font-extrabold leading-[1.12] tracking-tight text-primary sm:text-4xl md:text-4xl lg:text-5xl xl:text-[3.25rem] xl:leading-[1.08]">
15 Point Checklist <span class="text-on-primary-container">that I've used to close</span> 3000+ Real Estate deals <span class="text-on-primary-container">over 20 years</span>
</h1>
<div class="h-1 w-20 bg-secondary md:h-1.5 md:w-24"></div>
</div>
<div class="space-y-3 rounded-xl border border-[#d4cbcf]/60 bg-[#faf7f8]/85 p-4 shadow-sm backdrop-blur-sm sm:p-5 md:space-y-4 md:p-6">
<div>
<input class="w-full rounded-lg border border-outline-variant/25 bg-white/70 px-3.5 py-2.5 text-sm text-on-surface shadow-sm placeholder:text-outline/80 transition-all focus:border-secondary/40 focus:outline-none focus:ring-2 focus:ring-secondary/30 md:px-4 md:py-3" id="email" placeholder="name@firm.com" type="email"/>
</div>
<button class="flex w-full items-center justify-center gap-2 rounded-lg bg-secondary px-5 py-3 text-base font-bold font-headline text-on-secondary shadow-md transition-all hover:opacity-90 active:scale-[0.98]" type="button">
Get Access Now!
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="text-center text-[10px] uppercase tracking-wider text-on-surface-variant/90">(Let us know where to send it)</p>
</div>
</div>
</div>
</section>
